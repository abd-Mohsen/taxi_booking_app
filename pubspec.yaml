name: taxi_booking_app
description: "a simplified taxi booking module that demonstrates Flutter development skills."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get: ^4.6.6
  get_storage: ^2.1.1
  geolocator: ^10.1.1
  flutter_osm_plugin: ^1.4.1
  permission_handler: ^12.0.1
  timer_count_down: ^2.2.2
  http: ^1.2.2
  dropdown_search: ^6.0.1
  flutter_spinkit: ^5.2.1
  flutter_svg: ^2.0.16
#  smooth_page_indicator: ^1.2.0+3
  lottie: ^3.1.0
#  timeago: ^3.7.0
  flutter_phone_direct_caller: ^2.1.0
  font_awesome_flutter: ^10.8.0
  app_settings: ^6.0.0
  modal_bottom_sheet: ^3.0.0
  flutter_rating_bar: ^4.0.1
  flutter_timer_countdown: ^1.0.7
  webview_flutter: ^4.13.0
#  intl: ^0.20.2
  modal_progress_hud_nsn: ^0.5.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0


flutter:
  uses-material-design: true

  fonts:
    - family: Alexandria
      fonts:
        - asset: assets/fonts/Alexandria-VariableFont_wght.ttf